- title: Research Interest
  type: list
  contents:
    - My research focuses on efficient generative modeling, particularly diffusion and flow-based models. I aim to develop fundamental learning principles, efficient training methods, and novel architectures that improve the scalability and generation quality of these models while reducing their training and inference costs. A central goal of my research is to enable high-quality generation with minimal computational resources and fewer NFE.

