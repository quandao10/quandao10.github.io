<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Protected page</title>
<style>
 :root{--bg:#faf9f7;--fg:#1b1b1f;--dim:#65656d;--line:#e3e3df;--accent:#1d5c86;
  --global-divider-color:#e3e3df;--global-text-color:#1b1b1f;--global-theme-color:#1d5c86;
  --global-code-bg-color:#f1f1ee;color-scheme:light}
 @media (prefers-color-scheme:dark){:root{--bg:#121214;--fg:#ededf0;--dim:#9a9aa3;--line:#2a2b32;
  --accent:#6fb3dd;--global-divider-color:#2a2b32;--global-text-color:#ededf0;
  --global-theme-color:#6fb3dd;--global-code-bg-color:#1c1d21;color-scheme:dark}}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);line-height:1.6;font-size:16px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px))}
 .shell{max-width:760px;margin:0 auto;padding-block:16vh 10vh}
 h1.lock{font-size:1.35rem;margin:0 0 .4rem;letter-spacing:-.01em}
 p.sub{color:var(--dim);font-size:.92rem;margin:0 0 1.4rem}
 form{display:flex;gap:.5rem;flex-wrap:wrap}
 input{flex:1 1 240px;min-width:0;font:inherit;font-size:.95rem;padding:.6rem .8rem;
  border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg)}
 input:focus{outline:2px solid var(--accent);outline-offset:1px}
 button{font:inherit;font-size:.92rem;padding:.6rem 1.1rem;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--fg);cursor:pointer}
 button:hover{border-color:var(--accent);color:var(--accent)}
 .msg{font-size:.88rem;margin-top:.9rem;min-height:1.3em}
 .msg.bad{color:#b4472f} .msg.work{color:var(--dim)}
 #post{max-width:860px;margin:0 auto;padding-block:30px 60px}
 #post h1.pv-title{font-size:2rem;letter-spacing:-.02em;margin:0 0 1.2rem}
 #post img,#post video{max-width:100%}
 #post table{width:100%}
 .ribbon{max-width:860px;margin:0 auto;font-size:.8rem;color:var(--dim);
  border-bottom:1px solid var(--line);padding:10px 0}
</style>
</head>
<body>
<div class="shell" id="gate">
  <h1 class="lock">This page is protected</h1>
  <p class="sub">Enter the password to decrypt it. Nothing readable is stored here — the text
  and every clip are encrypted, and the key never leaves your browser.</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="Password" aria-label="Password" autofocus>
    <button type="submit">Unlock</button>
  </form>
  <div class="msg" id="m"></div>
</div>
<div class="ribbon" id="ribbon" hidden>Decrypted in your browser · unlisted page</div>
<div id="post" hidden></div>
<script>
(function(){
 "use strict";
 var BASE = "/private/f6cbfecd87f9b1ef/";
 var BUST = "?v=aa675dcb";
 var gate=document.getElementById("gate"), msg=document.getElementById("m"),
     post=document.getElementById("post"), ribbon=document.getElementById("ribbon");
 function say(t,c){msg.textContent=t; msg.className="msg"+(c?" "+c:"");}
 var dec=new TextDecoder();
 // A script error used to leave the button doing nothing at all, with no message on screen.
 window.addEventListener("error", function(ev){
   say("Script error: "+(ev.message||"unknown")+" (line "+(ev.lineno||"?")+")","bad");
 });
 window.addEventListener("unhandledrejection", function(ev){
   var r=ev.reason;
   say("Failed: "+((r&&r.message)||r||"unknown"),"bad");
 });

 function b64(s){var r=atob(s),a=new Uint8Array(r.length);
   for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}

 async function keyFrom(pw, salt, iters){
   var base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
     "PBKDF2", false, ["deriveKey"]);
   return crypto.subtle.deriveKey(
     {name:"PBKDF2", salt:salt, iterations:iters, hash:"SHA-256"},
     base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
 }
 async function open1(key, url){
   var r=await fetch(url, {cache:"no-store"});
   if(!r.ok) throw new Error("fetch "+r.status);
   var buf=new Uint8Array(await r.arrayBuffer());
   return crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, key, buf.slice(12));
 }

 document.getElementById("f").addEventListener("submit", async function(e){
   e.preventDefault();
   // A pasted password often carries a trailing newline or space, and sometimes a
   // zero-width character; none of that is part of the key.
   var raw=document.getElementById("pw").value;
   var pw=raw.replace(/[\u200B-\u200D\uFEFF]/g,"").trim();
   if(!pw){say("Enter the password.","bad");return;}
   if(!crypto.subtle){say("This browser cannot decrypt the page (no Web Crypto over http).","bad");return;}
   say("Deriving key…","work");
   var stage="load";   // load -> password -> render, so errors are not all "wrong password"
   var html;           // MUST be declared: "use strict" makes a bare assignment throw
   try{
     var mr=await fetch(BASE+"manifest.json"+BUST,{cache:"no-store"});
     if(!mr.ok) throw new Error("HTTP "+mr.status);
     var man=await mr.json();
     stage="password";
     var key=await keyFrom(pw, b64(man.salt), man.iter);
     say("Decrypting…","work");
     try{
       html=dec.decode(await open1(key, BASE+"page.bin"+BUST));
     }catch(e1){
       if(raw===pw) throw e1;
       key=await keyFrom(raw, b64(man.salt), man.iter);   // maybe the spaces were real
       html=dec.decode(await open1(key, BASE+"page.bin"+BUST));
     }
     stage="render";
     // Let the decrypted page resolve its own assets (the hero strip builds <video> in JS,
     // so it cannot use the data-enc attributes the shell rewrites).
     window.__ppvAsset=function(path){
       return open1(key, BASE+"enc/"+path+".bin"+BUST).then(function(buf){
         var mime=/\.mp4$/.test(path)?"video/mp4"
                 :(/\.png$/.test(path)?"image/png":"image/jpeg");
         return URL.createObjectURL(new Blob([buf],{type:mime}));
       });
     };
     post.innerHTML=html;
     gate.hidden=true; post.hidden=false; ribbon.hidden=false;
     // innerHTML does not execute <script>, so re-insert each one to run it
     [].slice.call(post.querySelectorAll("script")).forEach(function(old2){
       var sc=document.createElement("script");
       if(old2.src) sc.src=old2.src; else sc.textContent=old2.textContent;
       old2.parentNode.replaceChild(sc, old2);
     });
     document.title="Pixel Perceiver";
     // Media: every encrypted reference is a data-* attribute. Elements may carry two
     // (a <video> with both a poster and a source), and <source> needs the parent to reload.
     function paint1(el){
       var jobs=[];
       if(el.hasAttribute("data-enc")) jobs.push(["src", el.getAttribute("data-enc")]);
       if(el.hasAttribute("data-poster-enc")) jobs.push(["poster", el.getAttribute("data-poster-enc")]);
       jobs.forEach(function(j){
         var kind=j[0], path=j[1];
         open1(key, BASE+"enc/"+path+".bin"+BUST).then(function(buf){
           var mime=/\.mp4$/.test(path)?"video/mp4"
                   :(/\.png$/.test(path)?"image/png":"image/jpeg");
           var u=URL.createObjectURL(new Blob([buf],{type:mime}));
           if(kind==="poster"){ el.setAttribute("poster",u); return; }
           el.setAttribute("src",u);
           if(el.tagName==="SOURCE"){
             var v=el.parentNode;
             if(v && v.load) v.load();
           }
         }).catch(function(e){ el.setAttribute("data-enc-failed", String(e && e.message)); });
       });
     }
     var pend=[].slice.call(post.querySelectorAll("[data-enc],[data-poster-enc]"));
     if(!("IntersectionObserver" in window)){
       pend.forEach(paint1);                       // old browser: just decrypt everything
     } else {
       var io2=new IntersectionObserver(function(es){
         es.forEach(function(en){
           if(!en.isIntersecting) return;
           io2.unobserve(en.target);
           paint1(en.target);
         });
       },{rootMargin:"600px"});
       pend.forEach(function(el){
         // a <source> is zero-sized, so observe the <video> that holds it
         io2.observe(el.tagName==="SOURCE" ? el.parentNode : el);
       });
       // a <source> observed via its parent still needs its own paint
       pend.filter(function(el){return el.tagName==="SOURCE";}).forEach(paint1);
     }
     // "Download MP4": decrypt, then hand over a blob (plain Pages, so <a download> works)
     [].slice.call(post.querySelectorAll("[data-dl-enc]")).forEach(function(a2){
       a2.addEventListener("click", function(ev){
         ev.preventDefault();
         var path=a2.getAttribute("data-dl-enc"), old=a2.textContent;
         a2.textContent="Decrypting\u2026";
         open1(key, BASE+"enc/"+path+".bin"+BUST).then(function(buf){
           var u=URL.createObjectURL(new Blob([buf],{type:"video/mp4"}));
           var t=document.createElement("a");
           t.href=u; t.download=path.split("/").pop();
           document.body.appendChild(t); t.click(); t.remove();
           setTimeout(function(){URL.revokeObjectURL(u);},30000);
           a2.textContent=old;
         }).catch(function(){ a2.textContent="failed"; });
       });
     });
   }catch(err){
     if(stage==="load"){
       say("Could not load this page's data ("+err.message+"). Check the link, or the "
           +"deploy may still be running.","bad");
     } else if(stage==="password"){
       say("That password did not work. ("+pw.length+" characters read; page data fingerprint "+man.salt.slice(0,6)+"). If you are sure it is right, reload with Ctrl+Shift+R \u2014 a cached copy of the old page can cause this.","bad");
     } else {
       say("Decrypted, but the page could not be rendered.","bad");
     }
   }
 });
})();
</script>
</body>
</html>
